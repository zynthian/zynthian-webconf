<style>
    * {
        margin: 0;
        padding: 0;
    }
    body {
        background-color: #000;
        overflow: hidden;
    }
    .audio-wrapper {
        float: right;
    }
    /* Style the audio iframe to look like a small control widget */
    .audio-frame {
        width: 300px;
        height: 45px;
        border: none;
        overflow: hidden;
        background: transparent;
        overflow: hidden;
    }
    /* Responsive, Proportionate VNC Frame Wrapper */
    .vnc-frame {
        width: 100%;
        height: 100%;

        /* Set this to match Zynthian resolution */
        /*max-width: 800px;
        max-height: 480px;*/

        border: 0px;
        background-color: #000;
        overflow: hidden;
    }

    div.zynthian_mockup_container {
        display: block;
    }

    svg.v5_mockup {
        display: block;
    }

    svg.v5_mockup svg#push-buttons image {
        cursor: pointer;
    }

    svg.v5_mockup svg#push-knobs circle {
        cursor: pointer;
        opacity: 0.01;
        r: 40px;
        fill: #808080;
    }
    svg.v5_mockup svg#push-knobs circle:hover {
        cursor: pointer;
        opacity: 0.1;
        fill: #c0c000;
    }
</style>

    <script>
    const targetHost = "zynthian-pc.local";

    const wsPort = "8370"
    const vncPort = "8443";
    const audioPort = "8889";

    const audioPath = "zynstream";

    const wsUrl = "ws://" + targetHost + ":" + wsPort;
    const vncUrl = "https://" + targetHost + ":" + vncPort + "/?resize=remote";
    const audioUrl = "http://" + targetHost + ":" + audioPort + "/" + audioPath + "/";

    window.addEventListener('DOMContentLoaded', () => {
        console.log("Loading VNC Link:", vncUrl);
        console.log("Loading Audio Link:", audioUrl);
        document.getElementById('vncVisualNode').src = vncUrl;
        document.getElementById('audioStreamNode').src = audioUrl;
    });

    // Open the websocket connection with zynthian UI
    var zynWS = null;
    try {
        zynWS = new WebSocket(wsUrl);
        zynWS.onopen = () => {
            console.log("Connected to Zynthian UI Websocket");
        };
        zynWS.onmessage = (event) => {
            console.log("Incomming Data => " + event.data)
            try {
                const data = JSON.parse(event.data);
                if (data["wsled_state"]) {
                    queueLedState(data["wsled_state"])
                    setLedState(1)
                }
            } catch (error) {
                console.error("Failed to parse incoming packet:", error);
            }
        };
        zynWS.onclose = () => {
            console.log("Disconnected from Zynthian UI Websocket");
            setLedStateOff()
        };

    } catch (error) {
        console.error("Failed to open websocket connection at " + wsUrl, error);
    }

    //-----------------------------------------------------------------------------
    // Mockup LEDs
    //-----------------------------------------------------------------------------

    var wscolor_off = "#505050";
    var wscolor_white = "#F0F0F0";
    var wscolor_red = "#C00000";
    var wscolor_green = "#00F000";
    var wscolor_yellow = "#D0D000";
    var wscolor_orange = "#F08000";
    var wscolor_blue = "#0050FF";
    var wscolor_blue_light = "#00E0E0";
    var wscolor_purple = "#E000E0";
    var ledstate_colors = {
        "0": wscolor_off,
        "B": wscolor_blue,
        "G": wscolor_green,
        "R": wscolor_red,
        "O": wscolor_orange,
        "Y": wscolor_yellow,
        "P": wscolor_purple
    }

    var v5_led_order = [0, 1, 2, 3, 7, 6, 5, 4, 8, 9, 10 , 11, 15, 14, 13, 12, 16, 17, 18, 19]
    var led_state = null

    function setLedColor(led_id, color) {
        var elem = document.getElementById(led_id)
        elem.setAttribute("fill", color)
    }

    function queueLedState(ls) {
        led_state = ls
    }

    function setLedState(fix_order) {
        if (!led_state) return;
        var c = 0;
        var cc = 0;
        var lsl = led_state.split(",")
        for (let i = 1; i <= 5; i++) {
            for (let j = 1; j <= 4; j++) {
                if (fix_order) cc = v5_led_order[c]
                else cc = c
                color = ledstate_colors[lsl[cc]];
                setLedColor(`led-${i}${j}`, color);
                c++;
            }
        }
        led_state = null;
    }

    function setLedStateOff() {
        for (let i = 1; i <= 5; i++) {
            for (let j = 1; j <= 4; j++) {
                setLedColor(`led-${i}${j}`, wscolor_off);
            }
        }
    }

    //-----------------------------------------------------------------------------
    // Buttons & Encoders Action
    //-----------------------------------------------------------------------------

    function zynswitchCUIA(zswi, action) {
        if (zynWS.readyState === WebSocket.OPEN) {
            const payload = {
                cuia: "zynswitch",
                args: [zswi, action]
            };
            var data = JSON.stringify(payload)
            console.log(data)
            zynWS.send(data);
        }
    }

    function zynpotCUIA(zpi, delta) {
        if (zynWS.readyState === WebSocket.OPEN) {
            const payload = {
                cuia: "zynpot",
                args: [zpi, delta]
            };
            var data = JSON.stringify(payload)
            console.log(data)
            zynWS.send(data);
        }
    }

    // Variables for push & drag management

    let last_pushed_zswi = -1;
    let isDragging = false;
    let isDragged = false;
    let lastY = 0;
    let pixelAccumulator = 0;
    let visualAngle = 0;
    const PIXELS_PER_TICK = 10;     // Sensitivity: How many pixels of vertical drag equal 1 encoder click/tick

    function startDrag(ev) {
        isDragging = true;
        isDragged = false;
        lastY = ev.clientY;
        pixelAccumulator = 0;
        //encoder.setPointerCapture(ev.pointerId);
    }

    function stopDrag(ev) {
        if (!isDragging) return;
        isDragging = false;
        //encoder.releasePointerCapture(ev.pointerId);
    }

    function zynswitchAction(target, action, ev) {
        if (action == "P") {
            zswi = parseInt(target.getAttribute('data-id'));
            last_pushed_zswi = zswi;
            startDrag(ev)
        }
        else {
            zswi = last_pushed_zswi
            last_pushed_zswi = -1
            stopDrag(ev)
        }

        if (zswi < 0) {
            return;
        }
        // Visual Feedback
        else if (zswi >= 20) {
            var knob_id = zswi - 19
            if (action == "P") setKnobPush(knob_id, true);
            else setKnobPush(knob_id, false);
        }
        else if (zswi < 20) {
            var but_id = `${1 + Math.floor(zswi / 4)}${1 + zswi % 4}`
            if (action == "P") setButtonPush(but_id, true)
            else setButtonPush(but_id, false)
        }

        // CUIA
        if (!isDragged) {
            zynswitchCUIA(zswi + 4, action)
        }
    }

    function zynpotDrag(target, ev) {
        if (!isDragging || last_pushed_zswi < 20) return;

        // Dragging UP increases value (positive delta), dragging DOWN decreases it
        const deltaY = lastY - ev.clientY;
        lastY = ev.clientY;
        pixelAccumulator += deltaY;

        // Check if movement crossed one or more tick thresholds
        while (Math.abs(pixelAccumulator) >= PIXELS_PER_TICK) {
            const step = pixelAccumulator > 0 ? 1 : -1;
            pixelAccumulator -= step * PIXELS_PER_TICK;

            visualAngle = (visualAngle + step * 15) % 360;
            //dial.setAttribute('transform', `rotate(${visualAngle} 50 50)`);

            let zpi = last_pushed_zswi - 20
            zynpotCUIA(zpi, step);
            if (!isDragged) {
                isDragged = true;
                // Cancel push action
                if (last_pushed_zswi >= 0)
                    zynswitchCUIA(last_pushed_zswi + 4, "X")
            }
        }
    }

    function zynswitchConfigure(butid) {
        var butObj = document.getElementById(butid)

        // Pointer Listeners
        butObj.addEventListener('pointerdown', (e) => zynswitchAction(e.target, "P", e));
        //butObj.addEventListener('pointerup', (e) => zynswitchAction(e.target, "R", e));

    }

    // Configure silicone buttons
    for (let i = 1; i <= 5; i++) {
        for (let j = 1; j <= 4; j++) {
            zynswitchConfigure(`but-${i}${j}`);
        }
    }

    // Configure knob rotary & switches
    for (let i = 1; i <= 4; i++) {
        zynswitchConfigure(`knob-${i}`);
    }

    // Configure Drag & Release Actions
    window.addEventListener('pointermove', (e) => zynpotDrag(e.target, e));
    window.addEventListener('pointerup', (e) => zynswitchAction(e.target, "R", e));
    window.addEventListener('pointercancel', (e) => zynswitchAction(e.target, "R", e));

    //-----------------------------------------------------------------------------
    // Mockup buttons & rotary graphics
    //-----------------------------------------------------------------------------

    var autoFadeTimeOuts = {}

    function fadeElem(eid, state) {
        var elem = document.querySelector("svg#v5_mockup #" + eid)
        if (elem) {
            if (state) {
                elem.style.opacity = "1";
                elem.classList.remove("fadeOutElem")
                elem.classList.add("fadeInElem")
            }
            else {
                elem.style.opacity = "0";
                elem.classList.remove("fadeInElem")
                elem.classList.add("fadeOutElem")
            }
        }
    }

    function autoFadeElemOutCB(eid) {
        fadeElem(eid, false)
        autoFadeTimeOuts[eid] = null
    }

    function autoFadeElem(eid) {
        if (autoFadeTimeOuts[eid]) clearTimeout(autoFadeTimeOuts[eid])
        fadeElem(eid, true)
        autoFadeTimeOuts[eid] = setTimeout(autoFadeElemOutCB, 100, eid)
    }

    function setButtonPush(bid, state) {
        console.log(`BUTTON PUSH ${bid}: ${state}`);
        fadeElem("but-" + bid, state)
        fadeElem("bout-" + bid, state)
    }

    function setKnobPush(kid, state) {
        console.log(`KNOB PUSH ${kid}: ${state}`);
        fadeElem("knout-" + kid, state)
    }

    function setKnobRotation(kid, dval) {
        console.log(`KNOB ROTATION ${kid}: ${dval}`);
        if (dval>0) autoFadeElem("rknob-" + kid)
        else if (dval<0) autoFadeElem("lknob-" + kid)
    }

    </script>
