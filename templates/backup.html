<style>
  body {
    font-family: Arial, sans-serif;
  }

  .tree ul {
    list-style: none;
    margin-left: 20px;
    padding-left: 16px;
    border-left: 1px dashed #ccc;
  }

  .folder.collapsed > ul {
    display: none;
  }

  .folder_icon {
    width: 16px;
    display: inline-block;
    cursor: pointer;
  }
  .file_icon {
    width: 16px;
    display: inline-block;
  }
</style>

<div class="pull-right">
	<input id="check_advanced_view" type="checkbox" onChange="onchange_check_advanced_view()"/><span><label for="check_advanced_view">Advanced view</label></span>
</div>

<h2>{{title}}</h2>

<form id="restore-upload-form" action="#" enctype="multipart/form-data" method="post">
{% module Template('upload.html', config=config) %}
</form>

<form id="backup-form" enctype="multipart/form-data" method="post">
	<label>Backup profile</label>
	<select name="BACKUP_PROFILE" onchange="this.form.submit()">
		<option value="BACKUP_ALL" {% if config['profile'] == "BACKUP_ALL" %} selected{% end %}>All</option>
		{% for d in config['profiles'] %}
		<option value="{{d}}" {% if config['profile'] == d %} selected{% end %}>{{d}}</option>
		{% end %}
	</select>

	<div class="container-fluid">
		<div class="row normal-view">
			<button title="Do Backup" class="btn btn-lg btn-theme btn-block" onclick="download_backup()"><i class="fa fa-save"></i>Download Backup (tar.gz)</button>
			<button type="button" onclick="startCloudBackup()"" title="Do cloud backup" class="btn btn-lg btn-theme btn-block"><i class="fa fa-save"></i>Cloud Backup</button>
		</div>
		<div class="row normal-view">
			<button id="upload_show" title="Do upload restore" class="btn btn-lg btn-theme btn-block"><i class="fa fa-share-square"></i>Upload Restore (tar.gz, zip)</button>
			<button type="button" onclick="startCloudRestore()" title="Do cloud restore" class="btn btn-lg btn-theme btn-block"><i class="fa fa-share-square"></i>Cloud Restore</button>
		</div>
		<div class="row">
			<div id="restore-log" class="log-panel"></div>
		</div>
		{% if config['profile'] != "BACKUP_ALL" %}
		<div class="row advanced-view">
			<label>Directories to backup (full path):</label>
			<textarea id="BACKUP_PATHS" name="BACKUP_PATHS" rows="5">
				{% for d in config['profiles'][config['profile']]['paths'] %}{{d}}
        {% end %}
			</textarea>
		</div>
		<div class="row advanced-view">
			<label>Exclude rules (absolute (/...) or relative to each searched directory):</label>
			<textarea name="EXCLUDE_RULES" rows="3">
				{% for d in config['profiles'][config['profile']]['exclude_rules'] %}{{d}}
				{% end %}
			</textarea>
		</div>
		<div style="display: none;">
			<textarea id="EXCLUDE_PATHS" name="EXCLUDE_PATHS">
			</textarea>
		</div>
		<div class="row advanced-view">
			<button type="submit" name="action" value="SAVE_PROFILE" title="Save Backup Profile" class="btn btn-lg btn-theme btn-block"><i class="fa fa-check"></i>Save Profile</button>
		</div>
		{% end %}
		<div class="row advanced-view">
			<label>Resolved files to backup (unselect any files or folders to exclude):</label>
			<div class="tree" id="tree", name="TREE">
				{% raw config['BACKUP_TREE'] %}
			</div>
		</div>
	</div>
	<div class="row">
	{% if errors %}<div class="alert alert-danger">{{escape(errors)}}</div>{% end %}
	</div>
</form>

<div id="loading-div-background">
  <div id="loading-div" class="ui-corner-all">
    Processing. Please wait ...
  </div>
</div>

<script type="text/javascript">

$(document).ready(function (){
  $("#loading-div-background").hide();
	$('#input-uploadfile-type')[0].value = 'zip,tar.gz,tgz';

	var deferred = $.Deferred();
	deferred.done(function(value) {
		$("#upload_progress_panel").addClass("active");
		var socketMessage = {
			"handler_name": "UploadProgressHandler",
			"data": $('#input-uploadfile-session')[0].value
		};
		window.zynthianSocket.send(JSON.stringify(socketMessage));
	});
	connectZynthianWebSocket(deferred);

	var url = window.location.href
	var parts = url.split("/");
	$("#restore-upload-form").attr("action", "http://" + parts[2] + "/upload?clientId=" + $('#input-uploadfile-session')[0].value)

	$('#upload_panel')[0].onuploadend = function(response){
		console.log("upload succeeded: " + response);
		var logDiv = $("#restore-log");
		logDiv.addClass("updating");
		logDiv.html('');

		var socketMessage = {
			"handler_name": "RestoreMessageHandler",
			"data": response
		};
		window.zynthianSocket.registerHandler('RestoreMessageHandler', function(data) {
			if (data){
				console.log("RestoreMessageHandler:onmessage:", data);
				var logDiv = $("#restore-log");
				if (data == "EOCOMMAND"){
					logDiv.removeClass("updating");
				} else {
					logDiv.append(data + "<br />");
					logDiv[0].scrollTop = logDiv[0].scrollHeight;
				}
			}
		});
		window.zynthianSocket.send(JSON.stringify(socketMessage));
	}
	restore_advanced_view()
	updateFolderCheckboxes('tree');
});

function restore_advanced_view() {
	if (Cookies.get('advanced_view')) {
		$('input#check_advanced_view').prop("checked", true);
		$('.advanced-view').show();
	} else {
		$('input#check_advanced_view').prop("checked", false);
		$('.advanced-view').hide;
	}
}

function onchange_check_advanced_view() {
	if ($('input#check_advanced_view').prop("checked")==true) {
		Cookies.set('advanced_view','1')
		$('.advanced-view').slideDown(500);
	} else {
		Cookies.remove('advanced_view')
		$('.advanced-view').slideUp(500);
	}
}

const toggleFolder = function(e) {
	if (e.target.classList.contains("folder_icon")) {
		const li = e.target.closest(".folder");
		if (li) li.classList.toggle("collapsed");
    }
};

const toggleNode = function(e) {
    if (e.target.type !== "checkbox") return;
    const checkbox = e.target;
    const li = checkbox.closest("li");
    const childCheckboxes = li.querySelectorAll("input[type=checkbox]");
    childCheckboxes.forEach(cb => {
      cb.checked = checkbox.checked;
      cb.indeterminate = false;
    });
	updateParents(li.parentElement.closest("li"));
};

const tree = document.getElementById("tree");
tree.addEventListener("click", toggleFolder);
tree.addEventListener("change", toggleNode);

function updateParents(li) {
    if (!li) return;
    const checkboxes = li.querySelectorAll(":scope > ul input[type=checkbox]");
    const parentCheckbox = li.querySelector(":scope > input[type=checkbox]");
    let checkedCount = 0;
    checkboxes.forEach(cb => {
      if (cb.checked) checkedCount++;
    });

    if (checkedCount === 0) {
      parentCheckbox.checked = false;
      parentCheckbox.indeterminate = false;
    } else if (checkedCount === checkboxes.length) {
      parentCheckbox.checked = true;
      parentCheckbox.indeterminate = false;
    } else {
      parentCheckbox.checked = false;
      parentCheckbox.indeterminate = true;
    }
    updateParents(li.parentElement.closest("li"));
}

function getUncheckedPaths(treeId) {
  const tree = document.getElementById(treeId);
  const uncheckedPaths = [];
  // Find all checkboxes that are NOT checked and NOT indeterminate
  const checkboxes = tree.querySelectorAll('input[type="checkbox"]');
  checkboxes.forEach(checkbox => {
    // Skip if indeterminate
    if (checkbox.indeterminate) {
      return;
    }
    // Skip if checked
    if (checkbox.checked) {
      return;
    }
    // Check if any parent is unchecked (which means this child should be ignored)
    const li = checkbox.closest('li');
    if (li && li.dataset.path) {
      let parentLi = li.parentElement.closest('li');
      let hasUncheckedParent = false;
      
      while (parentLi) {
        const parentCheckbox = parentLi.querySelector(':scope > input[type="checkbox"]');
        if (parentCheckbox && !parentCheckbox.checked && !parentCheckbox.indeterminate) {
          hasUncheckedParent = true;
          break;
        }
        parentLi = parentLi.parentElement.closest('li');
      }
      
      // Only add if no parent is unchecked
      if (!hasUncheckedParent) {
        uncheckedPaths.push(li.dataset.path);
      }
    }
  });
  return uncheckedPaths;
}

function updateFolderCheckboxes(treeId) {
  const tree = document.getElementById(treeId);
  const folders = Array.from(tree.querySelectorAll('.folder'));
  folders.sort((a, b) => {
    const depthA = a.querySelectorAll('ul').length;
    const depthB = b.querySelectorAll('ul').length;
    return depthB - depthA;
  });
  folders.forEach(folder => {
    updateFolderCheckbox(folder);
  });
}

function updateFolderCheckbox(folderElement) {
  const folderCheckbox = folderElement.querySelector(':scope > input[type="checkbox"]');
  if (!folderCheckbox) return;
  const childCheckboxes = Array.from(
    folderElement.querySelectorAll(':scope > ul > li > input[type="checkbox"]')
  );
  if (childCheckboxes.length === 0) {
    return;
  }
  const checkedCount = childCheckboxes.filter(cb => cb.checked && !cb.indeterminate).length;
  const indeterminateCount = childCheckboxes.filter(cb => cb.indeterminate).length;
  if (indeterminateCount > 0) {
    folderCheckbox.checked = false;
    folderCheckbox.indeterminate = true;
  } else if (checkedCount === 0) {
    folderCheckbox.checked = false;
    folderCheckbox.indeterminate = false;
  } else if (checkedCount === childCheckboxes.length) {
    folderCheckbox.checked = true;
    folderCheckbox.indeterminate = false;
  } else {
    folderCheckbox.checked = false;
    folderCheckbox.indeterminate = true;
  }
}

// Update hidden exclude lists (used to pass data back to python class)
document.getElementById('backup-form').addEventListener('submit', function(event) {
  show_busy();
	document.getElementById("EXCLUDE_PATHS").value = getUncheckedPaths('tree').sort().join("\n");
});

// Handle backup (download) button
function download_backup() {
  const iframe = document.createElement('iframe');
  iframe.style.display = 'none';
  iframe.src = '/sys-backup/download';
  document.body.appendChild(iframe);
  // Cleanup iframe after download starts
  setTimeout(() => {
    if (iframe.parentNode) {
      document.body.removeChild(iframe);
    }
  }, 5000);
}

// --Cloud restore functions--

function enableButtons(enable) {
  $(':button').prop('disabled', enable);
}

function startRestoreSession() {
  var logDiv = $("#restore-log");
  logDiv.addClass("updating");
  logDiv.html('');

  window.zynthianSocket.registerHandler('RestoreMessageHandler', function(data) {
    if (data) {
      console.log("RestoreMessageHandler:onmessage:", data);
      if (data == "EOCOMMAND") {
        logDiv.removeClass("updating");
        // Re-enable the Kopia restore button once the operation ends
        $("#kopia_restore_button").prop("disabled", false).html(
          '<i class="fa fa-cloud-download"></i> Kopia Restore'
        );
      } else {
        logDiv.append(data + "<br />");
        logDiv[0].scrollTop = logDiv[0].scrollHeight;
      }
    }
  });
}

function startCloudBackup() {
		if (!window.zynthianSocket || window.zynthianSocket.readyState !== WebSocket.OPEN) {
			alert("WebSocket is not connected yet. Please wait a moment and try again.");
			return;
		}
		startRestoreSession();
		var socketMessage = {
			"handler_name": "RestoreMessageHandler",
			"data": "kopia_backup"
		};
		window.zynthianSocket.send(JSON.stringify(socketMessage));
}

function startCloudRestore() {
		if (!window.zynthianSocket || window.zynthianSocket.readyState !== WebSocket.OPEN) {
			alert("WebSocket is not connected yet. Please wait a moment and try again.");
			return;
		}
		startRestoreSession();
		var socketMessage = {
			"handler_name": "RestoreMessageHandler",
			"data": "kopia_restore"
		};
		window.zynthianSocket.send(JSON.stringify(socketMessage));
}
</script>
